name: Developer Branch Build Server

on:
    push:
        branches:
            - '**'          # Matches all branches
            - '!main'       # Excludes main
            - '!stage'      # Excludes staging
            - '!production' # Excludes production
        paths:
            - 'api/**'
            - 'shared/**'
            - '.github/workflows/check-dev-server.yml'

jobs:
    build-api:
        name: Build Server on Developer Branches
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./api

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Enable corepack
                run: corepack enable

            -   name: PNPM Version
                run: pnpm -v

            -   name: Install Dependencies
                run: pnpm i --frozen-lockfile

            -   name: Install Shared Dependencies
                run: pnpm -C ../shared i --frozen-lockfile

            -   name: Validate
                run: pnpm check

    test-real-api:
        name: Test API on Postgres
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: einbuergerungstest
                    POSTGRES_PASSWORD: einbuergerungstest
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U einbuergerungstest -d postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            REAL_DATABASE_URL: postgresql://einbuergerungstest:einbuergerungstest@localhost:5432/postgres
        defaults:
            run:
                working-directory: ./api

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Enable corepack
                run: corepack enable

            -   name: Install Dependencies
                run: pnpm i --frozen-lockfile

            -   name: Install Shared Dependencies
                run: pnpm -C ../shared i --frozen-lockfile

            -   name: Test on Postgres
                run: pnpm test:real
